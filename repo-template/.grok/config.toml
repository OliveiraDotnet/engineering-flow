# Shared project safeguards. User/organization settings own authentication,
# models, sandbox and permission modes. AGENTS.md governs task authorization.
# Commit is performed only by Grok Build after Matheus's explicit ok.
# Push is performed only by Jow, or by Matheus manually when Jow is unavailable.

[permission]
rules = [
  { action = "deny", tool = "bash", pattern = "git reset --hard" },
  { action = "deny", tool = "bash", pattern = "git reset --hard *" },
  { action = "deny", tool = "bash", pattern = "git clean *" },
  { action = "deny", tool = "bash", pattern = "rm -rf *" },
]
